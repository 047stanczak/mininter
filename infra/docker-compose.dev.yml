name: mininter
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  backend:
    build:
      context: ../backend/
      dockerfile: ../backend/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PLATFORM: ${DB_PLATFORM}
      DDL_AUTO: ${DDL_AUTO}
      SERVER_TIMEOUT: ${SERVER_TIMEOUT}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: false
      SWAGGER_ENABLED: true
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_NAME: ${MINIO_ACCESS_NAME}
      MINIO_ACCESS_SECRET: ${MINIO_ACCESS_SECRET}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    ports:
      - "8080:8080"
    expose:
      - "8080"
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ../frontend/
      dockerfile: ../frontend/Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  minio:
    image: firstfinger/minio:latest    
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_NAME}
      MINIO_ROOT_PASSWORD: ${MINIO_ACCESS_SECRET}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always

volumes:
  db_data:
  minio_data:
